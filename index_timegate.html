function b64ToStr(b){const bin=atob(b);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes);}
function showExpired(now){
  document.getElementById('box').innerHTML=
   '<div class="ico">🔒</div>'+
   '<h1>Akses Demo Kedaluwarsa</h1>'+
   '<p class="big">Tautan demo HanungFLAC ini berlaku <b>1 bulan</b> dan telah berakhir pada <span class="gold">'+EXPIRY_LABEL+'</span>.</p>'+
   '<p>Untuk perpanjangan atau akses lanjutan, hubungi:<br><b>'+CONTACT+'</b></p>'+
   '<div class="foot">HanungFLAC · GHM – Quality &amp; Geotechnical · PT Adaro Indonesia</div>';
}
function openTool(){
  const html=b64ToStr(TOOL_B64);
  document.open();document.write(html);document.close();
}
async function serverNow(){
  // pakai waktu server (header Date) agar tidak mudah diakali ganti jam lokal; fallback jam lokal
  try{
    const r=await fetch(location.href,{method:'HEAD',cache:'no-store'});
    const d=r.headers.get('date'); if(d){const t=new Date(d); if(!isNaN(t)) return t;}
  }catch(e){}
  return new Date();
}
(async function(){
  const now=await serverNow();
  if(now.getTime()<=EXPIRY.getTime()){
    document.getElementById('msg').textContent='Akses valid. Membuka alat…';
    setTimeout(openTool,250);
  }else{
    showExpired(now);
  }
})();
</script>
