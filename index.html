<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HanungFLAC — Terkunci</title>
<style>
 :root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--txt:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--danger:#ef4444;--ok:#22c55e}
 *{box-sizing:border-box}html,body{height:100%}
 body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);display:flex;align-items:center;justify-content:center}
 .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;width:360px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.4)}
 h1{margin:0 0 4px;font-size:19px}p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
 .lock{font-size:34px;text-align:center;margin-bottom:6px}
 label{display:block;font-size:12px;color:var(--muted);margin:16px 0 4px}
 input{width:100%;padding:10px;background:#273449;border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:14px}
 input:focus{outline:none;border-color:var(--accent)}
 button{width:100%;margin-top:14px;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:650;cursor:pointer;background:var(--accent);color:#06263a}
 button:hover{filter:brightness(1.08)}button:disabled{opacity:.6;cursor:progress}
 .msg{margin-top:12px;font-size:12.5px;min-height:16px}
 .err{color:var(--danger)}.ok{color:var(--ok)}
 .foot{margin-top:16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
</style></head>
<body>
<div class="box">
  <div class="lock">🔒</div>
  <h1>HanungFLAC — Analisis Stabilitas Lereng</h1>
  <p>Berkas terenkripsi (AES-256-GCM). Masukkan password untuk membuka.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autofocus autocomplete="off" spellcheck="false">
  <button id="go">🔓 Buka</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Source pada berkas ini hanya ciphertext; tanpa password isinya tak dapat dibaca maupun dijalankan. Perlindungan berlaku untuk berkas di disk, bukan sesi yang sudah terbuka.</div>
</div>
